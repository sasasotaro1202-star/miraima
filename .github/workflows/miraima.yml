name: MIRAIMA Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  miraima:
    runs-on: ubuntu-latest

    # GitHub側の最終安全弁
    timeout-minutes: 29

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MIRAIMA engine
        timeout-minutes: 25
        run: |
          python miraima_all_market.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miraima-results
          path: output/
          if-no-files-found: warn